<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Orbit session</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="panel"><button id="menu" class="badge" aria-label="Open Orbit stream controls"><span class="orbit-mark" aria-hidden="true"></span><strong>orbit<span>.</span></strong><span class="menu-label">Menu</span></button><section id="controls" hidden><p id="mode" class="eyebrow">NOW PLAYING</p><h1 id="title">Your PC</h1><p id="description" class="description">End the stream to return to your library.<br>Your game stays open on Zeiron.</p><label for="volume">Stream volume <output id="level">—</output></label><input id="volume" type="range" min="0" max="100" step="5" disabled><p id="audio-note" class="description">Checking stream audio…</p><label for="quality">Quality for next session</label><select id="quality"><option value="smooth">Smooth · 1200p / 120</option><option value="balanced">Balanced · 1200p / 60</option><option value="sharp">Sharp · 1600p / 60</option></select><p id="quality-note" class="description"></p><div class="actions"><button id="resume">Resume <small>B</small></button><button id="end" class="primary">End stream <small>A</small></button></div><div id="confirm" hidden><p id="confirm-label">Close this game on Zeiron?</p><div class="actions"><button id="cancel">Cancel</button><button id="confirm-end">Close game</button></div></div><p class="description">A · Select &nbsp; B · Resume &nbsp; ↑ ↓ · Move<br>Hold View + Menu · Open menu<br>Ctrl + Alt + O · Keyboard shortcut</p><p id="error" role="alert" hidden></p></section></main></body></html>
